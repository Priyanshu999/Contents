<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Deep Learning Perceptual Preprocessor Architecture
  </text>
  
  <!-- Input Section -->
  <rect x="50" y="70" width="120" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Vimeo-90K Dataset</text>
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#34495e">7 frames sequence</text>
  
  <rect x="50" y="150" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="110" y="170" text-anchor="middle" font-size="12" fill="white" font-weight="bold">RGB→YUV</text>
  <text x="110" y="185" text-anchor="middle" font-size="10" fill="white">Y-channel extraction</text>
  
  <rect x="50" y="210" width="120" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="110" y="235" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Target Frame</text>
  <text x="110" y="245" text-anchor="middle" font-size="10" fill="white">Middle frame (4th)</text>
  
  <!-- Deep Preprocessor Network -->
  <rect x="250" y="70" width="500" height="200" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="3" rx="10"/>
  <text x="500" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Deep Perceptual Preprocessor
  </text>
  
  <!-- Input layer -->
  <rect x="270" y="120" width="80" height="30" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="3"/>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="white">Input Conv</text>
  <text x="310" y="155" text-anchor="middle" font-size="8" fill="#34495e">1→64, d=1</text>
  
  <!-- Dilated convolution blocks -->
  <rect x="370" y="120" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="2" rx="3"/>
  <text x="400" y="140" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="400" y="155" text-anchor="middle" font-size="8" fill="#34495e">d=2</text>
  
  <rect x="450" y="120" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="2" rx="3"/>
  <text x="480" y="140" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="480" y="155" text-anchor="middle" font-size="8" fill="#34495e">d=4</text>
  
  <rect x="530" y="120" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="2" rx="3"/>
  <text x="560" y="140" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="560" y="155" text-anchor="middle" font-size="8" fill="#34495e">d=8</text>
  
  <rect x="610" y="120" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="2" rx="3"/>
  <text x="640" y="140" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="640" y="155" text-anchor="middle" font-size="8" fill="#34495e">d=16</text>
  
  <!-- Reverse dilated blocks -->
  <rect x="370" y="170" width="60" height="30" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="3"/>
  <text x="400" y="190" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="400" y="205" text-anchor="middle" font-size="8" fill="#34495e">d=8</text>
  
  <rect x="450" y="170" width="60" height="30" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="3"/>
  <text x="480" y="190" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="480" y="205" text-anchor="middle" font-size="8" fill="#34495e">d=4</text>
  
  <rect x="530" y="170" width="60" height="30" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="3"/>
  <text x="560" y="190" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="560" y="205" text-anchor="middle" font-size="8" fill="#34495e">d=2</text>
  
  <rect x="610" y="170" width="60" height="30" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="3"/>
  <text x="640" y="190" text-anchor="middle" font-size="9" fill="white">DilConv</text>
  <text x="640" y="205" text-anchor="middle" font-size="8" fill="#34495e">d=1</text>
  
  <!-- Final conv -->
  <rect x="680" y="145" width="60" height="30" fill="#8e44ad" stroke="#7d3c98" stroke-width="2" rx="3"/>
  <text x="710" y="165" text-anchor="middle" font-size="9" fill="white">Final Conv</text>
  <text x="710" y="180" text-anchor="middle" font-size="8" fill="#34495e">64→1</text>
  
  <!-- Residual connection -->
  <path d="M 270 135 Q 250 135 250 160 Q 250 185 270 185 L 680 185 Q 700 185 700 165" 
        fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="475" y="225" text-anchor="middle" font-size="12" fill="#e74c3c" font-weight="bold">
    Residual Connection: α×output + identity
  </text>
  
  <!-- Virtual Codec Section -->
  <rect x="800" y="70" width="350" height="200" fill="#fff3cd" stroke="#ffc107" stroke-width="3" rx="10"/>
  <text x="975" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Virtual Codec
  </text>
  
  <!-- DCT Transform -->
  <rect x="820" y="120" width="80" height="30" fill="#fd7e14" stroke="#e8590c" stroke-width="2" rx="3"/>
  <text x="860" y="140" text-anchor="middle" font-size="10" fill="white">4×4 DCT</text>
  <text x="860" y="155" text-anchor="middle" font-size="8" fill="#34495e">Block-wise</text>
  
  <!-- Quantization -->
  <rect x="920" y="120" width="80" height="30" fill="#dc3545" stroke="#c82333" stroke-width="2" rx="3"/>
  <text x="960" y="140" text-anchor="middle" font-size="10" fill="white">Quantization</text>
  <text x="960" y="155" text-anchor="middle" font-size="8" fill="#34495e">+ Uniform noise</text>
  
  <!-- Dequantization -->
  <rect x="1020" y="120" width="80" height="30" fill="#dc3545" stroke="#c82333" stroke-width="2" rx="3"/>
  <text x="1060" y="140" text-anchor="middle" font-size="10" fill="white">Dequantization</text>
  <text x="1060" y="155" text-anchor="middle" font-size="8" fill="#34495e">×qstep</text>
  
  <!-- IDCT Transform -->
  <rect x="920" y="170" width="80" height="30" fill="#fd7e14" stroke="#e8590c" stroke-width="2" rx="3"/>
  <text x="960" y="190" text-anchor="middle" font-size="10" fill="white">4×4 IDCT</text>
  <text x="960" y="205" text-anchor="middle" font-size="8" fill="#34495e">Reconstruction</text>
  
  <!-- Loss Function Section -->
  <rect x="200" y="320" width="950" height="220" fill="#e8f5e8" stroke="#28a745" stroke-width="3" rx="10"/>
  <text x="675" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Multi-Component Loss Function
  </text>
  
  <!-- Fidelity Loss -->
  <rect x="230" y="370" width="200" height="120" fill="#ffffff" stroke="#6c757d" stroke-width="2" rx="5"/>
  <text x="330" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">Fidelity Loss</text>
  <rect x="250" y="410" width="80" height="25" fill="#17a2b8" stroke="#138496" stroke-width="1" rx="3"/>
  <text x="290" y="427" text-anchor="middle" font-size="10" fill="white">L1 Loss</text>
  <text x="290" y="445" text-anchor="middle" font-size="8" fill="#34495e">α = 0.2</text>
  
  <rect x="250" y="450" width="80" height="25" fill="#6f42c1" stroke="#59359a" stroke-width="1" rx="3"/>
  <text x="290" y="467" text-anchor="middle" font-size="10" fill="white">MS-SSIM</text>
  <text x="290" y="485" text-anchor="middle" font-size="8" fill="#34495e">β = 0.8</text>
  
  <text x="350" y="427" font-size="12" fill="#495057">+</text>
  <text x="350" y="467" font-size="12" fill="#495057">×(1-SSIM)</text>
  
  <!-- Rate Loss -->
  <rect x="460" y="370" width="200" height="120" fill="#ffffff" stroke="#6c757d" stroke-width="2" rx="5"/>
  <text x="560" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">Rate Loss</text>
  <rect x="480" y="410" width="160" height="25" fill="#ffc107" stroke="#e0a800" stroke-width="1" rx="3"/>
  <text x="560" y="427" text-anchor="middle" font-size="10" fill="black">Divisive Normalization</text>
  
  <rect x="480" y="450" width="160" height="25" fill="#28a745" stroke="#1e7e34" stroke-width="1" rx="3"/>
  <text x="560" y="467" text-anchor="middle" font-size="10" fill="white">-∑log(P(coeff))/log(2)</text>
  <text x="560" y="485" text-anchor="middle" font-size="8" fill="#34495e">λ = 0.01</text>
  
  <!-- Perceptual Loss -->
  <rect x="690" y="370" width="200" height="120" fill="#ffffff" stroke="#6c757d" stroke-width="2" rx="5"/>
  <text x="790" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">Perceptual Loss</text>
  <rect x="710" y="410" width="160" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="790" y="427" text-anchor="middle" font-size="10" fill="white">YUV→RGB Conversion</text>
  
  <rect x="710" y="450" width="160" height="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="3"/>
  <text x="790" y="467" text-anchor="middle" font-size="10" fill="white">LIQE Score</text>
  <text x="790" y="485" text-anchor="middle" font-size="8" fill="#34495e">γ = 0.01</text>
  
  <!-- Training Details -->
  <rect x="920" y="370" width="200" height="120" fill="#ffffff" stroke="#6c757d" stroke-width="2" rx="5"/>
  <text x="1020" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">Training Setup</text>
  <text x="940" y="410" font-size="11" fill="#495057">• Adam Optimizer</text>
  <text x="940" y="425" font-size="11" fill="#495057">• Learning Rate: 1e-4</text>
  <text x="940" y="440" font-size="11" fill="#495057">• Batch Size: 8</text>
  <text x="940" y="455" font-size="11" fill="#495057">• Epochs: 30</text>
  <text x="940" y="470" font-size="11" fill="#495057">• Device: CUDA</text>
  
  <!-- Data Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Input to preprocessor -->
  <line x1="170" y1="230" x2="250" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Preprocessor to codec -->
  <line x1="750" y1="170" x2="800" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Codec flow -->
  <line x1="900" y1="135" x2="920" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1000" y1="135" x2="1020" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1060" y1="150" x2="1060" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1020" y1="185" x2="1000" y2="185" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- To losses -->
  <line x1="330" y1="270" x2="330" y2="370" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="270" x2="560" y2="370" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="270" x2="790" y2="370" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Network connections within preprocessor -->
  <line x1="350" y1="135" x2="370" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="135" x2="450" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="135" x2="530" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="135" x2="610" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="640" y1="150" x2="640" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="185" x2="590" y2="185" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="530" y1="185" x2="510" y2="185" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="185" x2="430" y2="185" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="185" x2="350" y2="185" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="670" y1="160" x2="680" y2="160" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Key Features Box -->
  <rect x="50" y="580" width="600" height="280" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="5"/>
  <text x="350" y="605" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Key Implementation Features
  </text>
  
  <text x="70" y="630" font-size="13" font-weight="bold" fill="#495057">Dilated Convolution Architecture:</text>
  <text x="70" y="650" font-size="12" fill="#495057">• 9-layer network with dilation rates: [1,2,4,8,16,8,4,2,1]</text>
  <text x="70" y="670" font-size="12" fill="#495057">• Multi-scale receptive field for feature extraction</text>
  <text x="70" y="690" font-size="12" fill="#495057">• Residual connection with learnable parameter α</text>
  
  <text x="70" y="720" font-size="13" font-weight="bold" fill="#495057">Virtual Codec Implementation:</text>
  <text x="70" y="740" font-size="12" fill="#495057">• Differentiable 4×4 DCT/IDCT transforms</text>
  <text x="70" y="760" font-size="12" fill="#495057">• Quantization with additive uniform noise for gradient flow</text>
  <text x="70" y="780" font-size="12" fill="#495057">• Block-wise processing maintaining spatial structure</text>
  
  <text x="70" y="810" font-size="13" font-weight="bold" fill="#495057">LIQE Integration:</text>
  <text x="70" y="830" font-size="12" fill="#495057">• No-reference perceptual quality assessment</text>
  <text x="70" y="850" font-size="12" fill="#495057">• Trained on diverse datasets (superior to KONIQ-only)</text>
  
  <!-- Current Status -->
  <rect x="700" y="580" width="650" height="280" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
  <text x="1025" y="605" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Current Implementation Status
  </text>
  
  <text x="720" y="630" font-size="13" font-weight="bold" fill="#495057">Completed Components:</text>
  <text x="720" y="650" font-size="12" fill="#495057">✓ Dilated convolution preprocessor network</text>
  <text x="720" y="670" font-size="12" fill="#495057">✓ Virtual codec with differentiable transforms</text>
  <text x="720" y="690" font-size="12" fill="#495057">✓ Multi-component loss function</text>
  <text x="720" y="710" font-size="12" fill="#495057">✓ LIQE perceptual loss integration</text>
  <text x="720" y="730" font-size="12" fill="#495057">✓ Vimeo-90K dataset preprocessing</text>
  <text x="720" y="750" font-size="12" fill="#495057">✓ Training pipeline with validation</text>
  
  <text x="720" y="780" font-size="13" font-weight="bold" fill="#e74c3c">Work in Progress:</text>
  <text x="720" y="800" font-size="12" fill="#495057">• Model training and hyperparameter optimization</text>
  <text x="720" y="820" font-size="12" fill="#495057">• Performance evaluation on test dataset</text>
  <text x="720" y="840" font-size="12" fill="#495057">• Integration with Android POC system</text>
</svg>
